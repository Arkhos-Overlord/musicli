[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "musicli"
version = "0.1.0"
description = "Premium retro CRT/VGA CLI music player with high-fidelity audio processing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Arkhos-Overlord", email = "arkhos-overlord@users.noreply.github.com"},
]
keywords = ["music", "player", "cli", "tui", "retro", "crt", "vga"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "miniaudio>=1.60",
    "numpy>=1.24",
    "scipy>=1.10",
    "mutagen>=1.47",
    "syncedlyrics>=1.0.0",
    "soundfile>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/Arkhos-Overlord/musicli"
Repository = "https://github.com/Arkhos-Overlord/musicli"
"Bug Tracker" = "https://github.com/Arkhos-Overlord/musicli/issues"

[project.scripts]
musicli = "musicli.main:main"

[tool.setuptools.packages.find]
include = ["musicli*"]
